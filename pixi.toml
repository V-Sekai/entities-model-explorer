[workspace]
name = "entities-model-explorer"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# gh, git, elixir, erlang, perl are provided by the host image on CI/WSL; pixi only runs the script.

[tasks]
# Reproduce the Linux leg of .github/workflows/release.yml locally: fetch the engine + guest ELFs,
# export the pck, package the Linux build (real --export-release embed_pck), and run the FDB
# round-trip self-test. Needs an authenticated `gh` (GH_TOKEN or `gh auth login`) and `elixir`.
# Minutes, not the ~5-10 of a CI round trip; `bash tools/local_build_test.sh --skip-fetch` while
# iterating on package_desktop.exs so only the pck/package/test steps rerun.
build = "bash tools/local_build_test.sh"
