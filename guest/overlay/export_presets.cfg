[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.remap,*.elf,*.glb,motion/mm/*.f32,motion/mm/*.tsv,motion/mm/*.txt,vsk_model_explorer/course/*.json"
exclude_filter="*.gd"
export_path="out/index.html"

[preset.0.options]

variant/extensions_support=true
variant/thread_support=true
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/head_include="<style>html,body,#canvas{background:#ededeb !important}</style>"
progressive_web_app/enabled=false
custom_template/release=""
custom_template/debug=""
