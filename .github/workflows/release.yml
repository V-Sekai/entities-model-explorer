name: Release

# Run it (workflow_dispatch) on the commit to release. Nobody types a tag: the tag is computed from the commit
# (RFD66606-2312, "release tags are go pseudo-versions"), v0.0.0-<UTC committer time YYYYMMDDhhmmss>-<12 hex>,
# so it sorts by time in a file listing and parses as a version in Mix, Cargo, npm and Go. The `stage` input
# (dev, beta, rc, release) is not in the tag: it moves the stage pointer tag of that name to the commit and sets
# the GitHub pre-release flag (everything but release). `publish: false` builds the packages and uploads them as
# workflow artifacts only. The CITATION.cff that ships in the package carries the per-build half of the release
# record: version (the tag), commit, date-released and the stage.
#   gh workflow run release.yml -R V-Sekai-fire/entities-model-explorer -f stage=dev
#
# Inputs: the double-precision engine from a V-Sekai-fire/entities-zone release (the Sandbox class is built
# into that engine, so there is no separate godot-sandbox library; the FoundationDB client ships beside each
# runtime) and the guest ELFs from green CI runs of their repos. The macOS build is Apple silicon only because the engine has no Intel build.
#
# Tokens the repo is given (org Actions secrets, visibility "selected", scoped to this repo; the values come
# from OpenBao and are written with `gh secret set --org V-Sekai-fire --repos entities-model-explorer`):
#   PERSONA_APP_ID, PERSONA_APP_PRIVATE_KEY   the v-sekai-fire-persona GitHub App. github.token cannot download
#                                             Actions artifacts of ANOTHER repo (even a public one), so the fetch
#                                             steps mint a one-hour installation token from the App instead.
#   APPLE_DEVID_P12, APPLE_DEVID_P12_PASSWORD "Developer ID Application" certificate and key as a .p12.
#   APPLE_NOTARY_KEY_P8, APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID   App Store Connect API key.
# The macOS package is signed (hardened runtime, Godot's GDExtension entitlements) and notarized with rcodesign
# (indygreg/apple-platform-rs) on the Linux runner: no macOS runner, no Xcode. When the Apple secrets are
# absent (a run from a fork) the macOS zip is published unsigned and the step says so.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage pointer to move to this commit; everything but release is a GitHub pre-release"
        type: choice
        options: [dev, beta, rc, release]
        default: dev
      publish:
        description: "Create the tag and the GitHub release (off: artifacts only)"
        type: boolean
        default: true
      engine_tag:
        description: "entities-zone release to take the double-precision engine from"
        default: "v0.0.0-20261106225526-d632cdf2be4c"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  ENGINE_TAG: ${{ inputs.engine_tag || 'v0.0.0-20261106225526-d632cdf2be4c' }}
  # The FoundationDB release fdbcli comes from; its server and client match the engine's (7.3).
  FDB_RELEASE: 7.3.79-weftspun-dev.2
  APP: walk-mode-viewer
  STAGE: ${{ inputs.stage || 'dev' }}
  GH_TOKEN: ${{ github.token }}
  # secrets.* is not allowed in a step's `if`; this env carries the answer.
  HAVE_APPLE_SECRETS: ${{ secrets.APPLE_DEVID_P12 != '' }}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # The tag is the commit's Go pseudo-version, computed exactly as RFD66606-2312 does. It must not exist yet
      # on another commit; the same commit re-run reuses it (the publish job then refuses a second release).
      - name: Compute the release tag from the commit
        id: tag
        run: |
          set -eu
          tag=$(TZ=UTC git log -1 --format='v0.0.0-%cd-%h' --date=format-local:%Y%m%d%H%M%S --abbrev=12)
          echo "$tag" | grep -Eq '^v0\.0\.0-[0-9]{14}-[0-9a-f]{12}$' || { echo "bad tag $tag"; exit 1; }
          if git fetch -q origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null; then
            at=$(git rev-list -n1 "$tag")
            [ "$at" = "$GITHUB_SHA" ] || { echo "tag $tag already points at $at, not $GITHUB_SHA"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Release tag: $tag, stage: $STAGE" >> "$GITHUB_STEP_SUMMARY"

      # github.token is scoped to this repo. Artifacts of godot-sandbox and the guest repos need actions:read
      # THERE, so mint an installation token from the persona App (one hour, this installation only).
      - name: Mint a GitHub App token for the other repos
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PERSONA_APP_ID }}
          private-key: ${{ secrets.PERSONA_APP_PRIVATE_KEY }}
          owner: V-Sekai-fire

      - name: Fetch the double-precision engine
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/engine"
          cd "$RUNNER_TEMP/engine"
          for f in godot.linuxbsd.editor.double.x86_64 \
                   godot.linuxbsd.template_release.double.x86_64 \
                   godot.macos.template_release.double.arm64 \
                   godot.windows.template_release.double.x86_64.llvm.exe \
                   libfdb_c.so libfdb_c.dylib fdb_c.dll SHA256SUMS; do
            gh release download "$ENGINE_TAG" -R V-Sekai-fire/entities-zone -p "$f"
          done
          grep -E ' \*?(godot\.linuxbsd\.editor\.double\.x86_64|godot\.linuxbsd\.template_release\.double\.x86_64|godot\.macos\.template_release\.double\.arm64|godot\.windows\.template_release\.double\.x86_64\.llvm\.exe|libfdb_c\.so|libfdb_c\.dylib|fdb_c\.dll)$' SHA256SUMS > wanted.sums
          [ "$(wc -l < wanted.sums)" = 7 ] || { echo "SHA256SUMS lacks an engine file"; cat SHA256SUMS; exit 1; }
          sha256sum -c wanted.sums
          chmod +x ./godot.*
          cp "$GITHUB_WORKSPACE/LICENSE" LICENSE-model-explorer.txt

      - name: Fetch the FoundationDB server and command line
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/engine"
          # fdbserver ships in the engine release, beside the client it was built with.
          for f in fdbserver.linux.x86_64 fdbserver.macos.arm64 fdbserver.windows.x86_64.exe; do
            gh release download "$ENGINE_TAG" -R V-Sekai-fire/entities-zone -p "$f"
          done
          grep -E ' \*?fdbserver\.(linux\.x86_64|macos\.arm64|windows\.x86_64\.exe)$' SHA256SUMS > server.sums
          [ "$(wc -l < server.sums)" = 3 ] || { echo "SHA256SUMS lacks an fdbserver"; cat SHA256SUMS; exit 1; }
          sha256sum -c server.sums
          # fdbcli is not in the engine release; it comes from the FoundationDB release the client comes from.
          mkdir cli && cd cli
          for f in fdbcli.linux.x86_64 fdbcli.macos.arm64 fdbcli.windows.x86_64.exe SHA256SUMS; do
            gh release download "$FDB_RELEASE" -R V-Sekai-fire/datasource-foundationdb -p "$f"
          done
          grep -E ' \*?fdbcli\.(linux\.x86_64|macos\.arm64|windows\.x86_64\.exe)$' SHA256SUMS > cli.sums
          [ "$(wc -l < cli.sums)" = 3 ] || { echo "SHA256SUMS lacks an fdbcli"; cat SHA256SUMS; exit 1; }
          sha256sum -c cli.sums
          mv fdbcli.* ..
          chmod +x ../fdbserver.* ../fdbcli.*

      - name: Fetch the guest programs and the walk data
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -eu
          tools/fetch_guest_assets.sh
          # The clip directories package_desktop.sh lays out into res://motion/mm/.
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/V-Sekai-fire/interactor-motion-matching-guest.git "$RUNNER_TEMP/mm-repo"
          git -C "$RUNNER_TEMP/mm-repo" sparse-checkout set data
          ls -la ./*.elf

      # The campus: Sakuragaoka Station at a pinned commit (public repo; plain git). Bump the pin in its own commit.
      - name: Fetch the campus (Sakuragaoka Station)
        env:
          STATION_SHA: d9c0f0f916c1e7280fab4f09fc685c6ea679d814
        run: |
          set -eu
          git clone -q --filter=blob:none https://github.com/V-Sekai-fire/entities-sakuragaoka-station.git "$RUNNER_TEMP/station"
          git -C "$RUNNER_TEMP/station" checkout -q "$STATION_SHA"
          test -f "$RUNNER_TEMP/station/addons/sakuragaoka_station/station.tscn"
          test -f "$RUNNER_TEMP/station/slug.double.elf"
          echo "Campus: entities-sakuragaoka-station $STATION_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Notices
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/notices"
          cp LICENSE "$RUNNER_TEMP/notices/LICENSE.md"
          printf '%s\n' \
            "V-Sekai Model Explorer, walk mode viewer" \
            "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA} by the Release workflow." \
            "Source and licences of the parts: https://github.com/${GITHUB_REPOSITORY}" \
            > "$RUNNER_TEMP/notices/NOTICE"
          printf '%s\n' \
            'cff-version: 1.2.0' \
            'message: "If you use this software, please cite it as below."' \
            'title: "V-Sekai Model Explorer"' \
            'authors:' \
            '  - name: "V-Sekai contributors"' \
            "repository-code: \"https://github.com/${GITHUB_REPOSITORY}\"" \
            "version: \"$TAG\"" \
            "commit: \"$GITHUB_SHA\"" \
            "date-released: \"$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)\"" \
            'identifiers:' \
            '  - type: other' \
            "    value: \"stage:$STAGE\"" \
            > "$RUNNER_TEMP/notices/CITATION.cff"

      - name: Export the pck
        run: |
          set -eu
          export GODOT="$RUNNER_TEMP/engine/godot.linuxbsd.editor.double.x86_64"
          export ENGINE="$RUNNER_TEMP/engine"
          export ELF="$PWD/skintokens.elf" USD_ELF="$PWD/usd.elf" MOTION_ELF="$PWD/motion.elf" \
                 HEADFIT_ELF="$PWD/headfit.elf" MM_ELF="$PWD/mm.elf" MUJOCO_ELF="$PWD/mujoco.elf" \
                 PERSONA_ELF="$PWD/persona.elf"
          export MM_DATA="$RUNNER_TEMP/mm-repo/data/kimodo-locomotion:$RUNNER_TEMP/mm-repo/data/o3de-motionmatching"
          # package_desktop.sh archives HEAD, so the fetched build products stay out of it.
          export STATION_DIR="$RUNNER_TEMP/station"
          tools/package_desktop.sh pck "$RUNNER_TEMP/out"

      - name: Package macOS, Windows and Linux
        run: |
          set -eu
          export ENGINE="$RUNNER_TEMP/engine" NOTICES="$RUNNER_TEMP/notices"
          mkdir -p "$RUNNER_TEMP/no-weights"
          tools/package_desktop.sh package "$RUNNER_TEMP/out" "$RUNNER_TEMP/no-weights" walk-mode
          mkdir -p dist
          cp "$RUNNER_TEMP/out/walk-mode/$APP"-*.zip "$RUNNER_TEMP/out/walk-mode/$APP"-*.tar dist/
          # Name the archives after the tag: walk-mode-viewer-<tag>-<os>-<arch>.<ext>
          tag="$TAG"
          cd dist
          for f in "$APP"-*; do mv "$f" "$APP-$tag-${f#"$APP"-}"; done
          ls -1 | grep -v '^SHA256SUMS$' | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
          # A package that cannot be read back is a failed build.
          for z in *.zip; do unzip -tq "$z"; done
          for t in *.tar; do tar -tf "$t" > /dev/null; done
          unzip -l "$APP-$tag-macos-arm64.zip" | grep -q "$APP.pck"
          unzip -l "$APP-$tag-windows-x86_64.zip" | grep -q "$APP.exe"
          tar -tf "$APP-$tag-linux-x86_64.tar" | grep -q "$APP.pck"

      # Godot's macOS export doc: sign with the hardened runtime and the GDExtension entitlements, then notarize.
      # rcodesign does both from Linux; a zip of a signed executable and library is an accepted notary asset.
      - name: Sign and notarize the macOS package (rcodesign)
        if: env.HAVE_APPLE_SECRETS == 'true'
        env:
          APPLE_DEVID_P12: ${{ secrets.APPLE_DEVID_P12 }}
          APPLE_DEVID_P12_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          CODE_SIGN_VERSION: "0.29.0"
          CODE_SIGN_SHA256: "dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002"
        run: |
          set -eu
          umask 077
          S="$RUNNER_TEMP/sign"; mkdir -p "$S/bin" "$S/pkg"
          # rcodesign, pinned by hash.
          a="apple-codesign-$CODE_SIGN_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$S/$a" "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F$CODE_SIGN_VERSION/$a"
          echo "$CODE_SIGN_SHA256  $S/$a" | sha256sum -c
          tar -xzf "$S/$a" -C "$S/bin" --strip-components=1
          RC="$S/bin/rcodesign"; "$RC" --version
          # Credentials to files that only this step reads; the runner's $RUNNER_TEMP is wiped with the job.
          printf '%s' "$APPLE_DEVID_P12" | base64 -d > "$S/devid.p12"
          printf '%s' "$APPLE_DEVID_P12_PASSWORD" > "$S/p12.pw"
          printf '%s\n' "$APPLE_NOTARY_KEY_P8" > "$S/AuthKey.p8"
          "$RC" encode-app-store-connect-api-key -o "$S/notary.json" "$APPLE_NOTARY_ISSUER_ID" "$APPLE_NOTARY_KEY_ID" "$S/AuthKey.p8"
          # Entitlements from the Godot export doc for a GDExtension-bearing build.
          cat > "$S/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.allow-dyld-environment-variables</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict></plist>
          PLIST
          zip="dist/$APP-$TAG-macos-arm64.zip"
          unzip -q "$zip" -d "$S/pkg"
          sign() { "$RC" sign --p12-file "$S/devid.p12" --p12-password-file "$S/p12.pw" --for-notarization "$@"; }
          # Nested code first (the FoundationDB client, server and command line beside the executable), then the executable with the entitlements.
          sign "$S/pkg/libfdb_c.dylib"
          sign "$S/pkg/fdbserver"
          sign "$S/pkg/fdbcli"
          sign --entitlements-xml-path "$S/entitlements.plist" "$S/pkg/$APP"
          "$RC" verify "$S/pkg/$APP"
          rm -f "$zip"
          (cd "$S/pkg" && zip -qry -n .gguf "$GITHUB_WORKSPACE/$zip" .)
          "$RC" notary-submit --api-key-file "$S/notary.json" --wait --max-wait-seconds 1500 "$zip"
          rm -rf "$S/devid.p12" "$S/p12.pw" "$S/AuthKey.p8" "$S/notary.json"
          (cd dist && ls -1 | grep -v '^SHA256SUMS$' | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS && cat SHA256SUMS)
          echo "macOS package signed as Developer ID and notarized" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      APP: walk-mode-viewer
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP }}-packages
          path: dist
      # Unpack the package as a user would, then run its own app. Each case must print the expected
      # FDB-SELFTEST verdict: an exit code alone proves nothing, since an app that cannot start also exits 1.
      - name: The packaged server starts, answers SQLite, and stops with the app
        shell: bash
        run: |
          # GitHub runs this with -e. The control cases are meant to exit 1, so -e must be off.
          set +e
          mkdir -p "$RUNNER_TEMP/pkg with space" && cd "$RUNNER_TEMP/pkg with space"
          case "$RUNNER_OS" in
            Linux) tar -xf "$GITHUB_WORKSPACE"/dist/*-linux-x86_64.tar; exe=./$APP ;;
            macOS) unzip -q "$GITHUB_WORKSPACE"/dist/*-macos-arm64.zip; exe=./$APP; chmod +x $APP fdbserver fdbcli ;;
            Windows) 7z x -y "$GITHUB_WORKSPACE"/dist/*-windows-x86_64.zip > /dev/null; exe=./$APP.exe ;;
          esac
          ls -la
          fails=0
          run() { # <label> <want rc> <want regex> <bin dir or empty> [user args]
            label=$1; want_rc=$2; want=$3; bin=$4; shift 4
            if [ -n "$bin" ]; then export WEFT_FDB_BIN_DIR="$bin"; else unset WEFT_FDB_BIN_DIR; fi
            export WEFT_FDB_STATE_DIR="$RUNNER_TEMP/fdb state"
            rm -f "$WEFT_FDB_STATE_DIR/selftest-result.txt"
            out=$(perl -e 'alarm 240; exec @ARGV' "$exe" --headless -- --fdb-selftest "$@" 2>&1); rc=$?
            # The verdict file, not stdout: the Windows runtime has no console.
            line=$(head -1 "$WEFT_FDB_STATE_DIR/selftest-result.txt" 2>/dev/null)
            echo "== $label: rc=$rc  $line"
            if [ "$rc" = "$want_rc" ] && echo "$line" | grep -Eq "$want"; then echo "   ok"; else echo "   WRONG, wanted rc=$want_rc and /$want/"; echo "$out" | tail -15; fails=$((fails+1)); fi
          }
          mkdir "$RUNNER_TEMP/empty"
          run "control: no fdbserver" 1 'FAIL plant=false mode=roundtrip fdbserver and fdbcli not found' "$RUNNER_TEMP/empty"
          run "round trip through the packaged server" 0 'PASS plant=false mode=roundtrip fdbserver [0-9]+ on port' ""
          run "second start reads the row the first wrote" 0 'PASS plant=false mode=read' "" --fdb-selftest-read
          run "planted wrong value" 1 'FAIL plant=true mode=roundtrip read back' "" --fdb-selftest-plant
          rm -rf "$RUNNER_TEMP/fdb state"
          run "control: a fresh state has no row" 1 'FAIL plant=false mode=read no row from an earlier run' "" --fdb-selftest-read
          echo "== no server left running"
          if [ "$RUNNER_OS" = Windows ]; then if tasklist | grep -i fdbserver; then fails=$((fails+1)); else echo "   none"; fi; else if pgrep -l fdbserver; then fails=$((fails+1)); else echo "   none"; fi; fi
          echo "failed cases: $fails"; exit $fails

  publish:
    needs: [package, verify]
    if: ${{ inputs.publish != false }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.package.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP }}-packages
          path: dist
      # `gh release create --target` makes the tag on the commit the workflow ran on. Everything but the
      # release stage is a pre-release. The stage pointer tag then moves to the same commit (RFD 2312 part 2).
      - name: Create the release and move the stage pointer
        run: |
          set -eu
          ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "release $TAG exists"; exit 1; }
          flags=""
          [ "$STAGE" = release ] || flags="--prerelease"
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $flags \
            --title "Model Explorer $TAG ($STAGE)" --generate-notes \
            --notes "Walk mode viewer for macOS (Apple silicon), Windows (x86_64) and Linux (x86_64). The macOS package is signed with a Developer ID and notarized; Windows is unsigned, so SmartScreen will warn. Verify with SHA256SUMS."
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$STAGE" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1 \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$STAGE" -f sha="$GITHUB_SHA" >/dev/null
          echo "Stage pointer $STAGE -> $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
